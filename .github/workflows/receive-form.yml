name: Receive Form Submission

on:
  repository_dispatch:
    types:
      - gform-submission

jobs:
  receive:
    runs-on: ubuntu-latest

    steps:
      - name: Receive, decrypt and forward submission
        env:
          ENCRYPTED_CODE: ${{ github.event.client_payload.encrypted_code }}
          DECODER: ${{ secrets.DECODER }}

        run: |
          cat > /tmp/decode.mjs <<'EOF'
          import crypto from "crypto";

          const encryptedCode = process.env.ENCRYPTED_CODE;
          const privateKey = process.env.DECODER;

          if (!encryptedCode) {
            throw new Error("No encrypted_code received");
          }

          if (!privateKey) {
            throw new Error("DECODER secret is missing");
          }

          const parsed = JSON.parse(encryptedCode);

          if (!Array.isArray(parsed.chunks)) {
            throw new Error("Payload does not contain chunks[]");
          }

          const decryptedChunks = parsed.chunks.map((chunk) => {
            return crypto.privateDecrypt(
              {
                key: privateKey,
                padding: crypto.constants.RSA_PKCS1_OAEP_PADDING,
                oaepHash: "sha256",
              },
              Buffer.from(chunk, "base64")
            );
          });

          const plaintext = Buffer
            .concat(decryptedChunks)
            .toString("utf8");

          const submission = JSON.parse(plaintext);

          // Add routing tag
          submission.tag = `[raw][${submission.siteId}]`;

          console.log("=== DECRYPTED FORM SUBMISSION ===");
          console.log(JSON.stringify(submission));
          console.log("=================================");

          // Save payload for curl
          await import("fs").then(fs =>
            fs.writeFileSync("/tmp/submission.json", JSON.stringify(submission))
          );
          EOF

          node /tmp/decode.mjs

          curl --fail-with-body -X POST \
            'https://formsubmit.co/ajax/slapkommerce@gmail.com' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            -H 'Origin: https://mtcmarketing.github.io' \
            -H 'Referer: https://mtcmarketing.github.io/' \
            -H 'User-Agent: Mozilla/5.0' \
            --data-binary '@/tmp/submission.json'
