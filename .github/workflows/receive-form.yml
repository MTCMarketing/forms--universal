name: Receive Form Submission

env:
  DEBUG: "true"

on:
  repository_dispatch:
    types:
      - gform-submission

jobs:
  receive:
    runs-on: ubuntu-latest

    steps:
      - name: Receive and decrypt submission
        env:
          ENCRYPTED_CODE: ${{ github.event.client_payload.encrypted_code }}
          DECODER: ${{ secrets.DECODER }}

        run: |
          cat > /tmp/decode.mjs <<'EOF'
          import crypto from "crypto";
          import fs from "fs";

          const DEBUG = process.env.DEBUG === "true";

          function debug(message, data = undefined) {
            if (!DEBUG) return;

            console.log(`\n[DEBUG] ${message}`);

            if (data !== undefined) {
              if (typeof data === "object") {
                console.log(JSON.stringify(data, null, 2));
              } else {
                console.log(data);
              }
            }
          }

          // --------------------------------------------------
          // 1. RECEIVE
          // --------------------------------------------------

          debug("1. Starting");

          const encryptedCode = process.env.ENCRYPTED_CODE;
          const privateKey = process.env.DECODER;

          if (!encryptedCode) {
            throw new Error("No encrypted_code received");
          }

          debug("2. Encrypted payload received");

          if (!privateKey) {
            throw new Error("DECODER secret is missing");
          }

          debug("3. DECODER secret found");


          // --------------------------------------------------
          // 2. PARSE ENCRYPTED PAYLOAD
          // --------------------------------------------------

          const parsed = JSON.parse(encryptedCode);

          if (!Array.isArray(parsed.chunks)) {
            throw new Error("Payload does not contain chunks[]");
          }

          debug("4. Payload parsed", {
            chunks: parsed.chunks.length
          });


          // --------------------------------------------------
          // 3. DECRYPT
          // --------------------------------------------------

          const decryptedChunks = parsed.chunks.map((chunk, index) => {

            debug(
              `5. Decrypting chunk ${index + 1}/${parsed.chunks.length}`
            );

            return crypto.privateDecrypt(
              {
                key: privateKey,
                padding: crypto.constants.RSA_PKCS1_OAEP_PADDING,
                oaepHash: "sha256",
              },
              Buffer.from(chunk, "base64")
            );
          });

          const plaintext = Buffer
            .concat(decryptedChunks)
            .toString("utf8");

          debug("6. Decrypted plaintext", plaintext);


          // --------------------------------------------------
          // 4. PARSE SUBMISSION
          // --------------------------------------------------

          const submission = JSON.parse(plaintext);

          debug("7. Parsed submission", submission);

          if (!submission.siteId) {
            throw new Error("Submission does not contain siteId");
          }


          // --------------------------------------------------
          // 5. ADD TAG
          // --------------------------------------------------

          submission.tag = `[raw][${submission.siteId}]`;

          debug("8. Tag created", submission.tag);


          // --------------------------------------------------
          // 6. SAVE RESULT FOR SHELL
          // --------------------------------------------------

          fs.writeFileSync(
            "/tmp/tag.txt",
            submission.tag
          );

          fs.writeFileSync(
            "/tmp/submission.json",
            JSON.stringify(submission)
          );

          console.log("");
          console.log("=== DECRYPTED FORM SUBMISSION ===");
          console.log(JSON.stringify(submission));
          console.log("=================================");
          EOF

          node /tmp/decode.mjs


          # --------------------------------------------------
          # 7. DELIBERATELY FAIL
          # --------------------------------------------------

          TAG="$(cat /tmp/tag.txt)"

          echo ""
          echo "========================================"
          echo "[DEBUG] TESTING GITHUB FAILURE NOTIFICATION"
          echo "Tag: $TAG"
          echo "========================================"
          echo ""

          echo "::error title=$TAG::TEST FORM SUBMISSION"

          exit 1
